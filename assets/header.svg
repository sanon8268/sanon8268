<svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="55%" r="65%">
    <stop offset="0%" stop-color="#220000"/>
    <stop offset="55%" stop-color="#0d0508"/>
    <stop offset="100%" stop-color="#080810"/>
  </radialGradient>
  <radialGradient id="eg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff0000" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="iris" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff8a7a"/>
    <stop offset="55%" stop-color="#ff1a1a"/>
    <stop offset="100%" stop-color="#6a0000"/>
  </radialGradient>
  <linearGradient id="pocket" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#030106"/>
    <stop offset="100%" stop-color="#260000"/>
  </linearGradient>
  <linearGradient id="flap" gradientUnits="userSpaceOnUse" x1="80" y1="80" x2="150" y2="150">
    <stop offset="0%" stop-color="#40151a"/>
    <stop offset="60%" stop-color="#1a090d"/>
    <stop offset="100%" stop-color="#0a0508"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <pattern id="dg" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r=".6" fill="#ff000015"/>
  </pattern>
  <clipPath id="wc"><rect width="900" height="240"/></clipPath>
  <clipPath id="pocketclip"><path d="M0,0 L150,0 Q93,93 0,150 Z"/></clipPath>
  <clipPath id="eyeclip"><path d="M-38,-4 L-14,-12 L20,-6 L40,10 L10,14 L-22,10 Z"/></clipPath>

  <style>
    @keyframes peel{
      0%,3%{transform:scale(0) rotate(0deg)}
      6%{transform:scale(.45) rotate(-5deg)}
      9%{transform:scale(1.08) rotate(2deg)}
      11%{transform:scale(1) rotate(0deg)}
      38%{transform:scale(1) rotate(0deg)}
      41%{transform:scale(.92) rotate(-2deg)}
      46%,100%{transform:scale(0) rotate(0deg)}
    }
    @keyframes eye{
      0%,11%{transform:scaleY(.02);opacity:0}
      14%{transform:scaleY(1.12);opacity:1}
      15%{transform:scaleY(1)}
      23%{transform:scaleY(1)}
      24%{transform:scaleY(.08)}
      25%{transform:scaleY(1)}
      31%{transform:scaleY(1)}
      32%{transform:scaleY(.08)}
      33%{transform:scaleY(1)}
      35%{transform:scaleY(1);opacity:1}
      37%,100%{transform:scaleY(.02);opacity:0}
    }
    @keyframes look{
      0%,15%{transform:translate(0,0)}
      18%{transform:translate(-8px,-2px)}
      22%{transform:translate(9px,2px)}
      27%{transform:translate(-5px,0)}
      30%{transform:translate(7px,-2px)}
      34%,100%{transform:translate(0,0)}
    }
    @keyframes flutter{0%,100%{transform:rotate(0deg)}50%{transform:rotate(1.2deg)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes scan{0%{transform:translateY(-12px)}100%{transform:translateY(12px)}}
    @keyframes rayPulse{0%,100%{opacity:.07}50%{opacity:.15}}
    @keyframes wR{from{transform:translateX(0)}to{transform:translateX(-220px)}}
    @keyframes wL{from{transform:translateX(-220px)}to{transform:translateX(0)}}
    @keyframes glitch{
      0%,84%,100%{opacity:0;transform:translateX(0)}
      85%{opacity:.45;transform:translateX(6px)}
      86%{opacity:.2;transform:translateX(-5px)}
      87%{opacity:0}
      91%{opacity:.35;transform:translateX(5px)}
      92%{opacity:0}
    }
    @keyframes ident{
      0%,19%{opacity:1;transform:translate(0,0)}
      19.6%{opacity:.2;transform:translate(6px,0)}
      20.2%{opacity:1;transform:translate(-5px,0)}
      20.8%{opacity:.4;transform:translate(0,4px)}
      22%{opacity:0;transform:translate(0,40px)}
      93%{opacity:0;transform:translate(0,40px)}
      94%{opacity:0;transform:translate(0,-20px)}
      98%,100%{opacity:1;transform:translate(0,0)}
    }
    @keyframes myth{
      0%,21%{opacity:0;transform:translateY(-170px)}
      21.5%{opacity:1;transform:translateY(-170px);animation-timing-function:cubic-bezier(.55,0,.9,.5)}
      28%{opacity:1;transform:translateY(0);animation-timing-function:cubic-bezier(.1,.5,.4,1)}
      31%{opacity:1;transform:translateY(-36px);animation-timing-function:cubic-bezier(.55,0,.9,.5)}
      34%{opacity:1;transform:translateY(0);animation-timing-function:cubic-bezier(.1,.5,.4,1)}
      36%{opacity:1;transform:translateY(-12px);animation-timing-function:cubic-bezier(.55,0,.9,.5)}
      38%{opacity:1;transform:translateY(0)}
      90%{opacity:1;transform:translateY(0)}
      93%{opacity:0;transform:translateY(0)}
      100%{opacity:0;transform:translateY(-170px)}
    }
    @keyframes flash{
      0%,27.8%{opacity:0}
      28%{opacity:.28}
      30%{opacity:0}
      34%{opacity:0}
      34.1%{opacity:.1}
      35.5%{opacity:0}
      100%{opacity:0}
    }
    @keyframes shock{
      0%,27.8%{opacity:0;transform:scale(.2)}
      28%{opacity:.8;transform:scale(.2)}
      34%{opacity:0;transform:scale(4)}
      100%{opacity:0;transform:scale(4)}
    }
    .corner{animation:peel 16s ease-in-out infinite}
    .eye{transform-box:fill-box;transform-origin:center;animation:eye 16s ease-in-out infinite}
    .look{animation:look 16s ease-in-out infinite}
    .d1{animation-delay:-8s}
    .flutter{transform-origin:75px 75px;animation:flutter 1.8s ease-in-out infinite}
    .ring{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}
    .scan{animation:scan 1.1s ease-in-out infinite alternate}
    .rays{animation:rayPulse 4s ease-in-out infinite}
    .wv1{animation:wR 7s linear infinite}
    .wv2{animation:wL 7s linear infinite}
    .gt{animation:glitch 10s step-end infinite}
    .ident{animation:ident 24s ease-in-out infinite}
    .myth{animation:myth 24s linear infinite}
    .flash{animation:flash 24s linear infinite}
    .shock{transform-box:fill-box;transform-origin:center;animation:shock 24s linear infinite}
  </style>
</defs>

<rect width="900" height="240" fill="url(#bg)"/>
<rect width="900" height="240" fill="url(#dg)"/>

<g class="rays" transform="translate(450,112)">
  <line x1="0" y1="0" x2="-440" y2="-118" stroke="#ff2200" stroke-width="1.4"/>
  <line x1="0" y1="0" x2="-295" y2="-210" stroke="#ff1500" stroke-width="1.2"/>
  <line x1="0" y1="0" x2="-110" y2="-215" stroke="#ff0000" stroke-width="1"/>
  <line x1="0" y1="0" x2="110" y2="-215" stroke="#ff0000" stroke-width="1"/>
  <line x1="0" y1="0" x2="295" y2="-210" stroke="#ff1500" stroke-width="1.2"/>
  <line x1="0" y1="0" x2="440" y2="-118" stroke="#ff2200" stroke-width="1.4"/>
  <line x1="0" y1="0" x2="-440" y2="92" stroke="#ff0000" stroke-width="1.2"/>
  <line x1="0" y1="0" x2="440" y2="92" stroke="#ff0000" stroke-width="1.2"/>
</g>

<!-- ===== HOODED FIGURE SHADOW (background) ===== -->
<g transform="translate(450,26) scale(.98)">
  <ellipse cx="0" cy="110" rx="130" ry="100" fill="url(#eg)" opacity=".45"/>
  <g fill="#000" fill-opacity=".66">
    <path d="M-18,36 C-20,12 -10,0 0,0 C10,0 20,12 18,36 C16,46 8,50 0,50 C-8,50 -16,46 -18,36 Z"/>
    <path d="M-20,44 C-38,48 -44,60 -44,82 L-42,116 C-41,122 -36,126 -30,126 L30,126 C36,126 41,122 42,116 L44,82 C44,60 38,48 20,44 C12,54 -12,54 -20,44 Z"/>
    <path d="M-43,64 C-54,82 -56,108 -54,128 L-43,130 C-42,112 -40,94 -38,76 Z"/>
    <path d="M43,64 C54,82 56,108 54,128 L43,130 C42,112 40,94 38,76 Z"/>
    <ellipse cx="-48.5" cy="134" rx="6" ry="7"/>
    <ellipse cx="48.5" cy="134" rx="6" ry="7"/>
    <path d="M-31,124 L31,124 L30,162 L26,198 L8,198 L3,142 L-3,142 L-8,198 L-26,198 L-30,162 Z"/>
    <path d="M-28,198 L-6,198 L-6,205 L-36,205 Z"/>
    <path d="M6,198 L28,198 L36,205 L6,205 Z"/>
  </g>
  <ellipse cx="0" cy="30" rx="10" ry="14" fill="#000" opacity=".9"/>
  <path d="M-26,100 Q0,110 26,100" fill="none" stroke="#ff2222" stroke-opacity=".15" stroke-width="1"/>
  <path d="M-6,52 L-6,74 M6,52 L6,74" fill="none" stroke="#ff2222" stroke-opacity=".18" stroke-width="1"/>
</g>

<!-- ===== TOP-LEFT CORNER ===== -->
<g>
  <g class="corner d0">
    <path d="M0,0 L150,0 Q93,93 0,150 Z" fill="url(#pocket)"/>
    <g clip-path="url(#pocketclip)" fill="none" stroke="#ff2222" stroke-width=".8" opacity=".35">
      <path d="M8,34 H34 L46,46 H96"/>
      <path d="M8,62 H28 L40,74 H70"/>
      <path d="M34,8 V30 L46,42 V82"/>
      <path d="M70,8 V24 L82,36"/>
      <circle cx="96" cy="46" r="2" fill="#ff2222"/>
      <circle cx="70" cy="74" r="2" fill="#ff2222"/>
      <circle cx="46" cy="82" r="2" fill="#ff2222"/>
    </g>
    <g transform="translate(50,50) rotate(14)">
      <g class="eye d0">
        <circle r="46" fill="url(#eg)"/>
        <g stroke="#ff2a2a" stroke-width=".7" opacity=".55">
          <line x1="-54" y1="0" x2="-44" y2="0"/>
          <line x1="46" y1="0" x2="56" y2="0"/>
        </g>
        <path d="M-38,-4 L-14,-12 L20,-6 L40,10 L10,14 L-22,10 Z" fill="#14000a" stroke="#ff2a2a" stroke-width="1.4"/>
        <g clip-path="url(#eyeclip)">
          <g class="look d0">
            <circle cx="4" cy="0" r="10" fill="url(#iris)"/>
            <circle class="ring" cx="4" cy="0" r="13" fill="none" stroke="#ff2a2a" stroke-width=".8" stroke-dasharray="5 4"/>
            <rect x="2.4" y="-12" width="3.2" height="24" fill="#000"/>
            <circle cx="0" cy="-4" r="1.6" fill="#ffd0d0" opacity=".85"/>
          </g>
          <rect class="scan" x="-40" y="-2" width="80" height="1.2" fill="#ff6a5a" opacity=".5"/>
        </g>
        <path d="M-42,-14 L26,-24" stroke="#ff2a2a" stroke-width="2" fill="none"/>
      </g>
    </g>
    <path d="M154,4 Q97,97 4,154 L164,164 Z" fill="#000" opacity=".55" filter="url(#sh)"/>
    <g class="flutter">
      <path d="M150,0 Q93,93 0,150 L150,150 Z" fill="url(#flap)"/>
      <path d="M144,12 Q95,98 12,144" fill="none" stroke="#ffb0a0" stroke-width="3" opacity=".22"/>
      <path d="M120,60 Q100,90 80,100" fill="none" stroke="#000" stroke-width="1" opacity=".5"/>
      <path d="M130,100 Q108,120 96,128" fill="none" stroke="#000" stroke-width="1" opacity=".5"/>
      <path d="M70,120 Q100,118 120,130" fill="none" stroke="#ff2222" stroke-width=".7" opacity=".25"/>
    </g>
    <path d="M150,0 Q93,93 0,150" fill="none" stroke="#ff2a2a" stroke-width="1.6"/>
  </g>
</g>

<!-- ===== TOP-RIGHT CORNER (mirrored, opposite timing) ===== -->
<g transform="translate(900,0) scale(-1,1)">
  <g class="corner d1">
    <path d="M0,0 L150,0 Q93,93 0,150 Z" fill="url(#pocket)"/>
    <g clip-path="url(#pocketclip)" fill="none" stroke="#ff2222" stroke-width=".8" opacity=".35">
      <path d="M8,34 H34 L46,46 H96"/>
      <path d="M8,62 H28 L40,74 H70"/>
      <path d="M34,8 V30 L46,42 V82"/>
      <path d="M70,8 V24 L82,36"/>
      <circle cx="96" cy="46" r="2" fill="#ff2222"/>
      <circle cx="70" cy="74" r="2" fill="#ff2222"/>
      <circle cx="46" cy="82" r="2" fill="#ff2222"/>
    </g>
    <g transform="translate(50,50) rotate(14)">
      <g class="eye d1">
        <circle r="46" fill="url(#eg)"/>
        <g stroke="#ff2a2a" stroke-width=".7" opacity=".55">
          <line x1="-54" y1="0" x2="-44" y2="0"/>
          <line x1="46" y1="0" x2="56" y2="0"/>
        </g>
        <path d="M-38,-4 L-14,-12 L20,-6 L40,10 L10,14 L-22,10 Z" fill="#14000a" stroke="#ff2a2a" stroke-width="1.4"/>
        <g clip-path="url(#eyeclip)">
          <g class="look d1">
            <circle cx="4" cy="0" r="10" fill="url(#iris)"/>
            <circle class="ring" cx="4" cy="0" r="13" fill="none" stroke="#ff2a2a" stroke-width=".8" stroke-dasharray="5 4"/>
            <rect x="2.4" y="-12" width="3.2" height="24" fill="#000"/>
            <circle cx="0" cy="-4" r="1.6" fill="#ffd0d0" opacity=".85"/>
          </g>
          <rect class="scan" x="-40" y="-2" width="80" height="1.2" fill="#ff6a5a" opacity=".5"/>
        </g>
        <path d="M-42,-14 L26,-24" stroke="#ff2a2a" stroke-width="2" fill="none"/>
      </g>
    </g>
    <path d="M154,4 Q97,97 4,154 L164,164 Z" fill="#000" opacity=".55" filter="url(#sh)"/>
    <g class="flutter">
      <path d="M150,0 Q93,93 0,150 L150,150 Z" fill="url(#flap)"/>
      <path d="M144,12 Q95,98 12,144" fill="none" stroke="#ffb0a0" stroke-width="3" opacity=".22"/>
      <path d="M120,60 Q100,90 80,100" fill="none" stroke="#000" stroke-width="1" opacity=".5"/>
      <path d="M130,100 Q108,120 96,128" fill="none" stroke="#000" stroke-width="1" opacity=".5"/>
      <path d="M70,120 Q100,118 120,130" fill="none" stroke="#ff2222" stroke-width=".7" opacity=".25"/>
    </g>
    <path d="M150,0 Q93,93 0,150" fill="none" stroke="#ff2a2a" stroke-width="1.6"/>
  </g>
</g>

<!-- ===== IDENTITY (vanishes at the drop) ===== -->
<g class="ident">
  <text x="450" y="125" text-anchor="middle" fill="#ff0000" opacity=".07" font-size="98" font-weight="bold" font-family="monospace" letter-spacing="14">SAN0N</text>
  <text x="450" y="124" text-anchor="middle" fill="#ee1111" font-size="90" font-weight="bold" font-family="monospace" letter-spacing="14" filter="url(#glow)">SAN0N</text>
  <text class="gt" x="450" y="124" text-anchor="middle" fill="#00ffcc" font-size="90" font-weight="bold" font-family="monospace" letter-spacing="14" opacity="0">SAN0N</text>
  <line x1="130" y1="146" x2="770" y2="146" stroke="#ff000030" stroke-width="1"/>
  <line x1="265" y1="146" x2="635" y2="146" stroke="#ff000070" stroke-width="1"/>
  <text x="450" y="168" text-anchor="middle" fill="#888888" font-size="12" font-family="monospace" letter-spacing="3">RED TEAM  ·  OFFENSIVE SECURITY  ·  CTF PLAYER</text>
  <text x="450" y="192" text-anchor="middle" fill="#ff000066" font-size="10" font-family="monospace" letter-spacing="2">⚔ ADVERSARY SIMULATION · PENETRATION TESTING · SECURITY RESEARCH ⚔</text>
</g>

<!-- ===== DROP IMPACT ===== -->
<rect class="flash" width="900" height="240" fill="#ff0000" opacity="0"/>
<ellipse class="shock" cx="450" cy="150" rx="120" ry="14" fill="none" stroke="#ff2a2a" stroke-width="2" opacity="0"/>

<!-- ===== PRIVACY IS A MYTH (drops, bounces twice, stays) ===== -->
<g class="myth" opacity="0">
  <text x="453" y="137" text-anchor="middle" fill="#00ffcc" opacity=".3" font-size="46" font-weight="bold" font-family="monospace" letter-spacing="6">PRIVACY IS A MYTH</text>
  <text x="450" y="134" text-anchor="middle" fill="#ff1a1a" font-size="46" font-weight="bold" font-family="monospace" letter-spacing="6" filter="url(#glow)">PRIVACY IS A MYTH</text>
  <line x1="200" y1="152" x2="700" y2="152" stroke="#ff2a2a" stroke-width="1.5" opacity=".7"/>
</g>

<!-- ===== WAVES ===== -->
<g clip-path="url(#wc)">
  <path d="M0,216 Q112,207 225,216 Q337,225 450,216 Q562,207 675,216 Q787,225 900,216 L900,240 L0,240Z" fill="#ff00001a"/>
  <path class="wv1" d="M-900,220 Q-787,212 -675,220 Q-562,228 -450,220 Q-337,212 -225,220 Q-112,228 0,220 Q112,212 225,220 Q337,228 450,220 Q562,212 675,220 Q787,228 900,220 Q1012,212 1125,220" fill="none" stroke="#ff000078" stroke-width="1.6"/>
  <path class="wv2" d="M-900,226 Q-787,219 -675,226 Q-562,233 -450,226 Q-337,219 -225,226 Q-112,233 0,226 Q112,219 225,226 Q337,233 450,226 Q562,219 675,226 Q787,233 900,226 Q1012,219 1125,226" fill="none" stroke="#ff00004a" stroke-width="1.1"/>
</g>

<rect width="900" height="2" fill="#dd0000" opacity=".9"/>
<rect y="238" width="900" height="2" fill="#dd0000" opacity=".9"/>
<polyline points="0,240 0,190" stroke="#ff0000" stroke-width="2.5" fill="none"/>
<polyline points="0,240 60,240" stroke="#ff0000" stroke-width="2.5" fill="none"/>
<polyline points="900,240 840,240" stroke="#ff0000" stroke-width="2.5" fill="none"/>
<polyline points="900,240 900,190" stroke="#ff0000" stroke-width="2.5" fill="none"/>
</svg>
