<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Grid dots -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ff000018"/>
  </pattern>
  <rect width="900" height="200" fill="url(#grid)"/>

  <!-- Top/bottom accent lines -->
  <rect width="900" height="3" fill="#ff0000" opacity="0.7"/>
  <rect y="197" width="900" height="3" fill="#ff0000" opacity="0.7"/>

  <!-- Corner brackets -->
  <polyline points="0,0 0,30" stroke="#ff0000" stroke-width="2" fill="none"/>
  <polyline points="0,0 40,0" stroke="#ff0000" stroke-width="2" fill="none"/>
  <polyline points="900,0 860,0" stroke="#ff0000" stroke-width="2" fill="none"/>
  <polyline points="900,0 900,30" stroke="#ff0000" stroke-width="2" fill="none"/>
  <polyline points="0,200 0,170" stroke="#ff0000" stroke-width="2" fill="none"/>
  <polyline points="0,200 40,200" stroke="#ff0000" stroke-width="2" fill="none"/>
  <polyline points="900,200 860,200" stroke="#ff0000" stroke-width="2" fill="none"/>
  <polyline points="900,200 900,170" stroke="#ff0000" stroke-width="2" fill="none"/>

  <!-- Hex decoration left -->
  <text x="30" y="105" fill="#ff000030" font-size="11" font-family="monospace">0x4F 0x46 0x46</text>
  <text x="30" y="120" fill="#ff000030" font-size="11" font-family="monospace">0x53 0x45 0x43</text>

  <!-- Hex decoration right -->
  <text x="750" y="105" fill="#ff000030" font-size="11" font-family="monospace">0x52 0x45 0x44</text>
  <text x="750" y="120" fill="#ff000030" font-size="11" font-family="monospace">0x54 0x45 0x41</text>

  <!-- Main title -->
  <text x="450" y="98" text-anchor="middle" fill="#ff2222"
        font-size="76" font-weight="bold" font-family="monospace"
        filter="url(#glow)" letter-spacing="12">SAN0N</text>

  <!-- Subtitle -->
  <text x="450" y="138" text-anchor="middle" fill="#888888"
        font-size="14" font-family="monospace" letter-spacing="3">
    RED TEAM  ·  OFFENSIVE SECURITY  ·  CTF PLAYER
  </text>

  <!-- Status bar bottom -->
  <text x="450" y="172" text-anchor="middle" fill="#ff000055"
        font-size="11" font-family="monospace">
    [ ADVERSARY SIMULATION · PENETRATION TESTING · SECURITY RESEARCH ]
  </text>
</svg>
